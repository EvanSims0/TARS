<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="tars-token" content="__TOKEN__">
<title>TARS · History</title>
<link rel="stylesheet" href="/static/tars.css">
<style>
  .split { grid-template-columns: 340px minmax(0, 1fr); }
  .sidebar { padding: 16px; gap: 6px; }
  .day { padding: 12px 4px 0; }
  .convo { position: relative; display: grid; gap: 2px; padding: 10px 12px; border-radius: var(--r-button); cursor: pointer;
           border: none; background: none; text-align: left; width: 100%; }
  .convo { min-width: 0; grid-template-columns: minmax(0, 1fr); }
  .convo:hover { background: var(--hover); }
  .convo[aria-current="true"] { background: var(--raised); }
  .convo .top { display: flex; align-items: center; gap: 8px; min-height: 20px; }
  .convo .title { font-size: 14px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo .time { font: 400 12px var(--mono); color: var(--text-2); flex: none; }
  .convo .snip { font-size: 12px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere; }
  .convo .forget { display: none; flex: none; }
  .convo:hover .forget, .convo[aria-current="true"] .forget { display: inline-flex; }
  .convo:hover .time, .convo[aria-current="true"] .time { display: none; }
  .sidefoot { margin-top: auto; padding-top: 12px; }
  .main { padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .tiles { display: grid; grid-template-columns: 1fr 1.3fr 1fr 1.15fr; gap: 12px; align-items: start; }
  .tile { gap: 2px; }
  .tile .big { font: 700 24px/1.45 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini { height: 4px; border-radius: 2px; background: var(--slate); margin-top: 6px; overflow: hidden; }
  .mini i { display: block; height: 100%; background: var(--text); }
  .section { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
  .rows { padding: 0; gap: 0; }
  .arow { display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 64px; }
  .arow .text { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .arow .text .t { font-size: 14px; font-weight: 500; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .arow .text .caption { overflow-wrap: anywhere; }
  .arow .text.undone .t { color: var(--text-2); text-decoration: line-through; }
  .arow .icon { flex: none; }
  .empty { padding: 16px; color: var(--text-2); font-size: 13px; }
  .exchange { display: grid; gap: 12px; }
  .exchange .said { font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  @media (max-width: 900px) {
    .split { grid-template-columns: minmax(0, 1fr); }
    .sidebar { max-height: 40vh; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    /* The Undo or Review button moves under the text instead of squeezing it to a sliver. */
    .arow { flex-wrap: wrap; }
    .arow .text { flex: 1 1 calc(100% - 40px); }
    .arow > :last-child:not(.text) { margin-left: 32px; }
  }
</style>
</head>
<body>
<div class="window">
  <div id="titlebar"></div>
  <div class="split">
    <aside class="sidebar" aria-label="Conversations">
      <label class="input search">
        <span aria-hidden="true" id="search-icon"></span>
        <input id="search" type="search" placeholder="Search conversations" aria-label="Search conversations">
        <span class="key">Ctrl+F</span>
      </label>
      <div id="convos" role="list"></div>
      <div class="sidefoot caption" id="keep"></div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>
<script src="/static/tars.js"></script>
<script>
(() => {
  const { api, el, icon, key, toast, shortcut, fmtTime } = TARS;
  document.getElementById("titlebar").replaceWith(TARS.titlebar("TARS · History"));
  document.getElementById("search-icon").replaceWith(icon("search", 16));

  let data = null, selected = null, query = "";
  const SERVICE = { "Google Calendar": ["calendar", "Calendar"], "Gmail": ["mail", "Email"], "Todoist": ["task", "Tasks"] };
  const LOCAL = { set_timer: ["timer", "Timer"], cancel_timer: ["timer", "Timer"], remember: ["memory", "Memory"],
                  forget: ["memory", "Memory"], set_personality: ["dial", "Personality"] };

  const dayLabel = (ts) => {
    const d = new Date(ts * 1000), today = new Date();
    const diff = Math.round((new Date(today.toDateString()) - new Date(d.toDateString())) / 86400000);
    if (diff === 0) return "Today";
    if (diff === 1) return "Yesterday";
    return d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "short" });
  };
  const titleOf = (x) => x.you.startsWith("[Scheduled]") ? "Morning brief" : x.you;
  const when = (ts) => {
    const label = dayLabel(ts);
    return label === "Today" ? fmtTime(ts) : `${label.toLowerCase().startsWith("yesterday") ? "yesterday" : label} ${fmtTime(ts)}`;
  };

  async function load() {
    try {
      data = await api("/api/history");
    } catch (e) {
      document.getElementById("main").replaceChildren(el("div", { class: "empty" }, e.message));
      return;
    }
    render();
  }

  function render() {
    renderList();
    renderMain();
    document.getElementById("keep").textContent =
      `Transcripts are kept ${data.keep_days} days. Change it in Settings → Privacy.`;
  }

  function renderList() {
    const box = document.getElementById("convos");
    const q = query.trim().toLowerCase();
    const items = data.exchanges.filter((x) => !q || x.you.toLowerCase().includes(q) || x.tars.toLowerCase().includes(q));
    const kids = [];
    let last = "";
    for (const x of items) {
      const label = dayLabel(x.ts);
      if (label !== last) { kids.push(el("div", { class: "label day" }, label)); last = label; }
      const forget = el("button", { type: "button", class: "btn btn-sm forget", title: "Forget this conversation",
        onclick: (e) => { e.stopPropagation(); forgetExchange(x); } }, "Forget", key("Del"));
      kids.push(el("button", { type: "button", class: "convo", role: "listitem", "aria-current": String(selected === x.ts),
        onclick: () => { selected = selected === x.ts ? null : x.ts; render(); } },
        el("div", { class: "top" }, el("span", { class: "title" }, titleOf(x)), el("span", { class: "time" }, fmtTime(x.ts)), forget),
        el("div", { class: "snip" }, x.tars || "(no reply)")));
    }
    if (!items.length) kids.push(el("div", { class: "empty" }, q ? "No conversation matches that." :
      `Nothing said in the last ${data.keep_days} days.`));
    box.replaceChildren(...kids);
  }

  function tile(label, big, caption, bar) {
    return el("div", { class: "card tile" }, el("span", { class: "label" }, label), el("div", { class: "big" }, big),
      el("span", { class: "caption" }, caption), bar === undefined ? null : el("div", { class: "mini" }, el("i", { style: `width:${Math.min(100, bar)}%` })));
  }

  function renderMain() {
    const main = document.getElementById("main");
    const t = data.today;
    const kids = [];
    const ex = data.exchanges.find((x) => x.ts === selected);
    if (ex) {
      kids.push(el("div", { class: "head" }, el("h1", { class: "h2" }, titleOf(ex)), el("span", { class: "spacer" }),
        el("span", { class: "caption" }, `${dayLabel(ex.ts)} · ${fmtTime(ex.ts)}`)));
      kids.push(el("div", { class: "card exchange" },
        el("div", { class: "who" }, el("span", { class: "label" }, "You"), el("div", { class: "said" }, ex.you)),
        el("div", { class: "who" }, el("span", { class: "label" }, "TARS"), el("div", { class: "said" }, ex.tars || "(no reply)")),
        el("div", { style: "display:flex;gap:10px" },
          el("button", { type: "button", class: "btn", onclick: () => { selected = null; render(); } }, "Back to today", key("Esc")),
          el("button", { type: "button", class: "btn", onclick: () => forgetExchange(ex) }, "Forget", key("Del")))));
    }
    kids.push(el("div", { class: "head" }, el("h1", { class: "h2" }, "Today"), el("span", { class: "spacer" }),
      el("span", { class: "caption" }, "Same numbers as tars status")));
    const s = (ms) => ms === undefined ? "–" : `${(ms / 1000).toFixed(1)} s`;
    kids.push(el("div", { class: "tiles" },
      tile("Typical reply", s(t.first_word_p50_ms), "median today"),
      tile("9 in 10", t.first_word_p90_ms === undefined ? "–" : `under ${s(t.first_word_p90_ms)}`, "slowest tenth above"),
      tile("Under 3 s", t.under_3s_share === undefined ? "–" : `${Math.round(t.under_3s_share * 100)}%`, `of ${t.turns} turn${t.turns === 1 ? "" : "s"}`),
      tile("Spend today", `$${t.spend_today.toFixed(2)}`, `$${t.spend_month.toFixed(2)} of $${t.cap.toFixed(0)} this month`,
        t.spend_month / t.cap * 100)));

    kids.push(el("div", { class: "section" }, el("span", { class: "h3" }, "Actions TARS took"), el("span", { class: "spacer" }),
      el("span", { class: "caption" }, "Undo where it can")));
    const rows = el("div", { class: "card rows" });
    if (!data.actions.length) rows.append(el("div", { class: "empty" },
      "Nothing yet. When TARS adds a task, moves an event or files email, it shows up here, with an Undo."));
    for (const a of data.actions.slice(0, 30)) {
      const [ic, label] = SERVICE[a.service] || LOCAL[a.tool] || ["task", a.service];
      let end;
      if (a.undone) end = el("span", { class: "caption" }, "Undone");
      else if (a.can_undo) end = el("button", { type: "button", class: "btn btn-sm", onclick: () => undo(a) }, "Undo");
      else if (a.tool === "send_email") end = el("span", { class: "caption" }, "Sent. No undo for email.");
      else if (!a.reversible) end = el("span", { class: "caption" }, "No undo for this.");
      else end = el("span", { class: "caption" }, "Undo expired");
      rows.append(el("div", { class: "arow" }, icon(ic, 18),
        el("div", { class: "text" + (a.undone ? " undone" : "") }, el("span", { class: "t", title: a.summary }, a.summary),
          el("span", { class: "caption" }, `${label} · ${when(a.ts)} · ${a.how}`)), end));
    }
    kids.push(rows);

    kids.push(el("div", { class: "section" }, el("span", { class: "h3" }, `Parked phone drafts · ${data.drafts.length}`),
      el("span", { class: "spacer" }), el("span", { class: "caption" }, "Sending still reads it back and waits for yes")));
    const drafts = el("div", { class: "card rows" });
    if (!data.drafts.length) drafts.append(el("div", { class: "empty" },
      "No drafts from the phone. Anything you ask to send from Telegram waits here until you’re at the PC."));
    data.drafts.forEach((d, i) => {
      const to = (d.to || []).join(", ") || "draft";
      drafts.append(el("div", { class: "arow" }, icon("phone", 18),
        el("div", { class: "text" }, el("span", { class: "t", title: `To ${to}${d.subject ? " · " + d.subject : ""}` },
          `To ${to}${d.subject ? " · " + d.subject : ""}`),
          el("span", { class: "caption" }, `“${(d.body || d.read_back).slice(0, 90)}${(d.body || "").length > 90 ? "…" : ""}” · parked ${when(d.created)}`)),
        el("button", { type: "button", class: "btn btn-sm" + (i === 0 ? " btn-primary" : ""), onclick: () => review(d.index) },
          "Review and send", i === 0 ? key("R") : null)));
    });
    kids.push(drafts);
    main.replaceChildren(...kids);
  }

  async function undo(a) {
    try { const r = await api("/api/undo", { id: a.id }); toast(r.message); } catch (e) { toast(e.message); }
    load();
  }
  async function review(index) {
    try { await api("/api/drafts/review", { index }); toast("Read back on the overlay. Say yes to send."); } catch (e) { toast(e.message); }
    load();
  }
  async function forgetExchange(x) {
    try { await api("/api/history/forget", { ts: x.ts }); toast("Forgotten"); if (selected === x.ts) selected = null; } catch (e) { toast(e.message); }
    load();
  }

  document.getElementById("search").addEventListener("input", (e) => { query = e.target.value; renderList(); });
  shortcut("ctrl+f", () => document.getElementById("search").focus());
  shortcut("Escape", () => { if (selected) { selected = null; render(); } });
  shortcut("Delete", () => { const x = data && data.exchanges.find((e) => e.ts === selected); if (x) forgetExchange(x); });
  shortcut("r", () => data && data.drafts.length && review(data.drafts[0].index));
  shortcut("ArrowDown", () => move(1));
  shortcut("ArrowUp", () => move(-1));
  function move(step) {
    if (!data || !data.exchanges.length) return;
    const i = data.exchanges.findIndex((x) => x.ts === selected);
    const next = data.exchanges[Math.max(0, Math.min(data.exchanges.length - 1, i + step))];
    selected = next.ts; render();
  }

  load();
  setInterval(() => { if (!document.hidden) load(); }, 15000);
})();
</script>
</body>
</html>
