name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, so a newly published vulnerability shows up without a push

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where TARS runs; Linux catches anything that only works there by accident.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: PortAudio headers for PyAudio (Linux only; Windows wheels bundle it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: The base install starts without the voice extras
        run: |
          uv sync --locked
          uv run --no-sync python -c "import tars.app, tars.cli, tars.ui.server, tars.ui.desktop"

      - name: Install everything from the lockfile
        run: uv sync --locked --extra voice --extra desktop --extra dev

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Run the offline tests
        run: uv run --no-sync pytest -q

  audit:
    # TARS holds the Gmail and Calendar sign-in, so a known hole in a dependency fails CI.
    # Windows, because that's where it runs; the Windows-only packages are checked too.
    name: Known vulnerabilities in dependencies
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Export the locked dependencies, every extra included
        run: uv export --locked --all-extras --no-emit-project --format requirements-txt -o requirements-audit.txt

      - name: Check them against the Python advisory database
        run: uvx --from pip-audit==2.9.0 pip-audit -r requirements-audit.txt --require-hashes --disable-pip --progress-spinner off
