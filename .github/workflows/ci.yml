name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where TARS runs; Linux catches anything that only works there by accident.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: PortAudio headers for PyAudio (Linux only; Windows wheels bundle it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: The base install starts without the voice extras
        run: |
          uv sync --locked
          uv run --no-sync python -c "import tars.app, tars.cli"

      - name: Install everything from the lockfile
        run: uv sync --locked --extra voice --extra dev

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Run the offline tests
        run: uv run --no-sync pytest -q
