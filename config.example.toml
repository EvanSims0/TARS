# TARS configuration. Copy to %APPDATA%\TARS\config.toml (or run `tars init`).
# API keys never go in this file: use `tars set-key NAME`, which stores them
# in Windows Credential Manager.

user_name = ""            # how TARS refers to you
user_email = ""           # your Gmail address, so "email me" works
# vault_path = "C:/Users/you/TARS Vault"     # default: %APPDATA%\TARS\vault
# backup_path = "D:/Backups/TARS Vault"      # default: %APPDATA%\TARS\vault-backups

[brain]
fast_model = "claude-haiku-5-5"
fast_effort = "low"
fast_thinking = false
deep_model = "claude-sonnet-5-5"
deep_effort = "medium"

[voice]
push_to_talk_key = "<ctrl>+<alt>+space"
mute_key = "<ctrl>+<alt>+m"
follow_up_seconds = 8.0
stt_model = "flux-general-en"
tts_model = "eleven_flash_v2_5"
tts_voice_id = "CGldoNGr4XAY3PAcEM3x"   # the original TARS voice designed in ElevenLabs
calm_voice_id = ""        # optional second voice for Vela, the calm mode
live_transcript = true    # show your words on the overlay as you speak
# input_device_index = 1   # leave unset for the Windows default devices
# output_device_index = 3

[spend]
monthly_cap_usd = 25.0
escalation_cutoff = 0.8
deepgram_usd_per_minute = 0.0077
elevenlabs_usd_per_1k_chars = 0.05

[alerts]
max_per_day = 3
quiet_start = "22:00"
quiet_end = "08:00"

[brief]
enabled = true
time = "09:00"            # spoken at 9, or as soon as the PC is on after 9 (once a day)
contents = "today's events, the weather, tasks due today, and anything urgent in email"
style = "mission"         # read as a pre-launch checklist; "plain" for a normal summary

[personality]
# Starting values. Saying "humor 40%", "bluntness 90%", "trust 60%", "Vela mode" or
# "back to TARS" changes them, and spoken changes are remembered.
humor = 70                # 0 = none; drops to 0 while presenting, 30 when you're swamped
bluntness = 60            # tact only; facts are exact at every level
trust = 100               # below 80, TARS asks before changing your lists, calendar or email

[email]
urgent = [
  "threats to personal information: security alerts, password resets you didn't ask for, suspicious logins, identity theft or data-breach notices",
  "money problems: failed or declined payments, overdrafts, overdue bills, collections, fraud alerts",
  "someone asking for a reply or decision by a deadline today or tomorrow",
]
ignore = ["newsletters", "promotions and marketing"]

[todoist]
shopping_project = "Shopping"
default_store = "Grocery"

[location]
home_address = ""
# latitude = 40.71
# longitude = -74.01
timezone = ""              # e.g. "America/New_York"

[privacy]
transcript_days = 7
backup_days = 30
