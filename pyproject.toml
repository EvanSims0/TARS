[project]
name = "tars"
version = "0.1.0"
description = "TARS: a hands-free everyday voice assistant powered by Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12.1",
    "httpx>=0.27",
    "keyring>=25",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
voice = [
    "pipecat-ai[deepgram,elevenlabs,local]==1.12.0",
    "pynput>=1.7",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
tars = "tars.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
