[project]
name = "tars"
version = "0.1.0"
description = "TARS: a hands-free everyday voice assistant powered by Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12.1",
    "httpx>=0.27",
    "keyring>=25",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "loguru>=0.7",
    # Windows has no system timezone database for zoneinfo.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
voice = [
    "pipecat-ai[deepgram,elevenlabs,local]==1.12.0",
    "pynput>=1.7",
]
# The Windows desktop shell: tray icon, overlay and app windows.
desktop = [
    "pywebview>=5.3",
    "pystray>=0.19",
    "pillow>=10",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.13",
]

[project.scripts]
tars = "tars.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned so every ruff version and machine checks the same things.
select = ["E4", "E7", "E9", "F", "I"]
